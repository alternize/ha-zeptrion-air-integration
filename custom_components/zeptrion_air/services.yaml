blind_recall_s1:
  name: Blind Recall S1
  description: Recalls scene S1 for the blind.
  target:
    entity:
      integration: zeptrion_air
      domain: cover

blind_recall_s2:
  name: Blind Recall S2
  description: Recalls scene S2 for the blind.
  target:
    entity:
      integration: zeptrion_air
      domain: cover

blind_recall_s3:
  name: Blind Recall S3
  description: Recalls scene S3 for the blind.
  target:
    entity:
      integration: zeptrion_air
      domain: cover

blind_recall_s4:
  name: Blind Recall S4
  description: Recalls scene S4 for the blind.
  target:
    entity:
      integration: zeptrion_air
      domain: cover

blind_step_up:
  name: Blind Step Up
  description: Moves the blind up for the specified duration.
  target:
    entity:
      integration: zeptrion_air
      domain: cover
  fields:
    duration:
      name: Duration
      description: Duration of the movement in milliseconds.
      required: false
      selector:
        number:
          min: 100
          max: 32000
          step: 100
          unit_of_measurement: ms

blind_step_down:
  name: Blind Step Down
  description: Moves the blind down for the specified duration.
  target:
    entity:
      integration: zeptrion_air
      domain: cover
  fields:
    duration:
      name: Duration
      description: Duration of the movement in milliseconds.
      required: false
      selector:
        number:
          min: 100
          max: 32000
          step: 100
          unit_of_measurement: ms
